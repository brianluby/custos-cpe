name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test Rust ${{ matrix.toolchain }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain: [stable, 1.94.0]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install "${{ matrix.toolchain }}" --profile minimal
      - run: cargo "+${{ matrix.toolchain }}" test --all-targets --locked
      - run: cargo "+${{ matrix.toolchain }}" test --doc --locked

  quality:
    name: Formatting, Clippy, docs, and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - run: cargo +stable fmt --all --check
      - run: cargo +stable fmt --manifest-path fuzz/Cargo.toml --check
      - run: cargo +stable clippy --all-targets --locked -- -D warnings
      - run: cargo +stable clippy --manifest-path fuzz/Cargo.toml --bins --locked -- -D warnings
      - run: RUSTDOCFLAGS="-D warnings" cargo +stable doc --no-deps --locked
      - run: cargo +stable check --manifest-path fuzz/Cargo.toml --bins --locked
      - run: cargo +stable package --locked

  fuzz:
    name: Bounded fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_FUZZ_VERSION: "0.13.2"
      FUZZ_TIME_SECONDS: "30"
      NIGHTLY_TOOLCHAIN: nightly-2026-07-16
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install "$NIGHTLY_TOOLCHAIN" --profile minimal --component rust-src
      - run: cargo "+$NIGHTLY_TOOLCHAIN" install cargo-fuzz --version "$CARGO_FUZZ_VERSION" --locked
      - run: cargo "+$NIGHTLY_TOOLCHAIN" fetch --manifest-path fuzz/Cargo.toml --locked
      - name: Run bounded fuzz campaigns
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          set -euo pipefail
          for target in parse_formatted_utf8 formatted_round_trip; do
            corpus="${RUNNER_TEMP}/fuzz-corpus/${target}"
            mkdir -p "$corpus"
            cargo "+$NIGHTLY_TOOLCHAIN" fuzz run "$target" "$corpus" fuzz/seeds -- \
              -max_total_time="$FUZZ_TIME_SECONDS" -max_len=4096 -timeout=10 -verbosity=0
          done
          git diff --exit-code -- fuzz/Cargo.lock fuzz/seeds

  no-std:
    name: Rust 1.94 no_std + alloc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.94.0 --profile minimal --target thumbv7em-none-eabihf
      - run: cargo +1.94.0 check --lib --locked --target thumbv7em-none-eabihf
